spring.application.name=mural

spring.datasource.url=jdbc:derby://localhost:1527/muralspring
spring.datasource.username = root
spring.datasource.password = root
spring.datasource.driver-class-name=org.apache.derby.client.ClientAutoloadedDriver

spring.jpa.database-platform=org.hibernate.community.dialect.DerbyDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.open-in-view = true
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl